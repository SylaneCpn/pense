name : Build
on :
    push :
permissions :
    contents : write

jobs:
  build-linux:
    strategy:
        matrix:
            os : [ubuntu-latest , ubuntu-24.04-arm]

    runs-on: $ {{matrix.os}}
    env :
        Arch : ${{matrix.os == 'ubuntu-latest' && 'x64' || 'arm64' }} 
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.24.0
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter build linux

      - name: Archive Linux Build
        run : tar -czf build-${{matrix.os}}.tar.gz -C build/linux/$Arch/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: pense-${{matrix.os}}
          path: build-${{matrix.os}}.tar.gz

  build-windows:
    strategy:
        fail-fast: false
        matrix:
            os : [windows-latest,windows-11-arm]
    runs-on: ${{matrix.os}}
    env:
        Arch : ${{matrix.os == 'windows-latest' && 'x64' || 'arm64' }} 
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.24.0
      - run: flutter build windows
      - name: Archive Windows Build
        run: Compress-Archive -Path build\windows\$Arch\runner\Release\* -DestinationPath build-${{matrix.os}}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pense-${{matrix.os}}
          path: ${{matrix.os}}.zip
 
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk
      - uses: actions/upload-artifact@v4
        with:
          name: pense.apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - run: flutter build appbundle
      - uses: actions/upload-artifact@v4
        with:
          name: pense-android-bundle
          path: build\app\outputs\bundle\release\app-release.aab


  