  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk
      - name: Rename apk
        run: mv build/app/outputs/flutter-apk/app-release.apk pense.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pense-android
          path: pense.apk
      - run: flutter build appbundle
      - name: Rename aab
        run: mv build/app/outputs/bundle/release/app-release.aab pense.aab
      - uses: actions/upload-artifact@v4
        with:
          name: pense-android-bundle
          path: pense.aab
  publish:
    needs:
      - build-linux-x64
      - build-windows-x64
      - build-linux-arm64
      - build-android
    runs-on: ubuntu-latest
    steps:
        - name: Download artifacts
          uses: actions/download-artifact@v4
          with:
            path: artifacts
        - name: Create release
          uses : softprops/action-gh-release@v2
          with:
            tag_name: ${{ github.ref_name }}
            name: Release ${{ github.ref_name }}
            files:  |
             artifacts/pense-linux-x64/pense-linux-x64.tar.gz
             artifacts/pense-windows-x64/pense-windows-x64.zip
             artifacts/pense-linux-arm64/pense-linux-arm64.tar.gz
             artifacts/pense-android/pense.apk
             artifacts/pense-android-bundle/pense.aab
    env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}