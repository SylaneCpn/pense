  build-windows-x64:
    strategy:
        fail-fast: false
    runs-on: windows-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.38.5
      - run: flutter build windows
      - name: Archive Windows Build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath pense-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pense-windows-x64
          path: pense-windows-x64.zip


