on:
  push:
    tags:
    - '*'
permissions :
    contents : write

name: Build and Release 

jobs:
  build-linux-x64:
    runs-on : ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.38.5
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter build linux

      - name: Archive Linux Build
        run : tar -czf pense-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: pense-linux-x64
          path: pense-linux-x64.tar.gz

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.38.5
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter build linux

      - name: Archive Linux Build
        run : tar -czf pense-linux-arm64.tar.gz -C build/linux/arm64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: pense-linux-arm64
          path: pense-linux-arm64.tar.gz
